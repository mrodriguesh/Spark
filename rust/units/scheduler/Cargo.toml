[package]
name = "spark-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `scheduler.js`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
napi = "3"
napi-derive = "3"
regex = "1.13.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.11.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
